<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0b0b" />
<link rel="manifest" href="manifest.webmanifest">
<title>Onion Skin Video</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; background:#0b0b0b; color:#eee; }
  #stage { display:grid; place-items:center; min-height:100svh; padding-bottom:128px; }
  canvas { max-width:100vw; max-height:calc(100svh - 128px); background:#000; }
  #ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:.6rem; flex-wrap:wrap;
        align-items:center; padding:.6rem; background:#000a; backdrop-filter: blur(6px); }
  button, select, input[type="file"] { background:#1e1e1e; color:#eee; border:1px solid #333; border-radius:10px; padding:.6rem .8rem; }
  button:disabled{opacity:.5}
  .grow { flex:1 }
  label { display:flex; align-items:center; gap:.4rem; }
  .pill { padding:.2rem .6rem; border-radius:100px; background:#153; border:1px solid #294; font-size:.85rem; }
  .danger { background:#521; border-color:#743; }
  .ok { background:#153; border-color:#294; }
  .info { background:#123; border-color:#345; }
  #log { position:fixed; top:3.2rem; left:.5rem; right:.5rem; text-wrap:balance; opacity:.95; display:flex; gap:.5rem; align-items:center; justify-content:center; }
  #banner { position:fixed; top:.5rem; left:.5rem; right:.5rem; display:none; gap:.5rem; align-items:center; justify-content:space-between; background:#123; border:1px solid #345; padding:.5rem .75rem; border-radius:12px; }
  #banner .msg{ font-size:.95rem; }
</style>

<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="banner">
  <div class="msg">Hay una nueva versión disponible.</div>
  <div style="display:flex; gap:.5rem;">
    <button id="reload" class="info">Actualizar</button>
    <button id="dismiss">Más tarde</button>
  </div>
</div>

<div id="log"></div>

<div id="ui">
  <input type="file" id="file" accept="video/*" />
  <button id="play">▶️ reproducir</button>
  <button id="pause">⏸️ pausar</button>
  <button id="back">⟵ cuadro atrás</button>
  <button id="fwd">cuadro adelante ⟶</button>
  <label class="grow">Opacidad cámara
    <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.5">
    <span id="alphaV" class="pill">50%</span>
  </label>
  <button id="camToggle">🔄 cámara: frontal</button>
  <button id="voice">🎤 voz: off</button>
  <button id="rec" class="info">⏺️ grabar</button>
  <button id="stopRec" class="danger" disabled>⏹️ detener</button>
  <button id="download">⬇️ descargar MP4/WebM</button>
  <button id="share">📤 compartir</button>
  <button id="install" style="display:none;">⬇️ Instalar app</button>
</div>

<script>
// PWA install & update handling
let deferredPrompt = null;
const installBtn = document.getElementById('install');
const banner = document.getElementById('banner');
const reloadBtn = document.getElementById('reload');
const dismissBtn = document.getElementById('dismiss');
let hasController = !!navigator.serviceWorker?.controller;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').then(reg => {
      // SW messages (update available)
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'UPDATE_READY') {
          if (hasController) {
            banner.style.display = 'flex';
          }
        }
      });

      reloadBtn.onclick = () => {
        // Tell SW to skip waiting, then reload when controller changes
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        } else {
          // If waiting is not available yet, try to trigger update check
          reg.update();
        }
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        }, { once: true });
      };
      dismissBtn.onclick = () => banner.style.display = 'none';
    });
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

// Try to lock orientation to portrait (best effort)
if (screen.orientation && screen.orientation.lock) {
  screen.orientation.lock('portrait').catch(()=>{});
}
</script>

<script>
(async () => {
  const $ = sel => document.querySelector(sel);
  const canvas = $("#canvas");
  const ctx = canvas.getContext("2d", { alpha:false });
  const file = $("#file");
  const playBtn = $("#play"), pauseBtn = $("#pause");
  const back = $("#back"), fwd = $("#fwd");
  const alpha = $("#alpha"), alphaV = $("#alphaV");
  const camToggle = $("#camToggle");
  const voiceBtn = $("#voice");
  const recBtn = $("#rec"), stopRecBtn = $("#stopRec");
  const dlBtn = $("#download"), shareBtn = $("#share");
  const log = $("#log");

  // Elementos ocultos de trabajo
  const vid = document.createElement("video");
  vid.playsInline = true; vid.controls = false; vid.muted = false;
  const cam = document.createElement("video");
  cam.playsInline = true; cam.muted = true; cam.autoplay = true;

  // Estado
  let facing = "user";
  let camStream = null;
  let framesRequested = false;
  let fpsEstimate = 30;
  let sr = null, voiceOn = false;
  let recorder = null, recordedChunks = [];
  let outBlob = null;
  let audioFromVideo = null;
  let videoCaptureStream = null;
  let canvasStream = null;
  let rafId = 0;

  function toast(msg, kind="ok") {
    log.innerHTML = `<span class="pill ${kind}">${msg}</span>`;
    clearTimeout(toast.tid); toast.tid = setTimeout(()=>log.innerHTML="", 2000);
  }

  async function startCamera() {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing }, audio:false });
    } catch (e) {
      toast("Permití el uso de la cámara.", "danger");
      return;
    }
    cam.srcObject = camStream;
    await cam.play().catch(()=>{});
    camToggle.textContent = `🔄 cámara: ${facing === 'user' ? 'frontal' : 'trasera'}`;
  }
  await startCamera();

  file.addEventListener("change", async () => {
    const f = file.files?.[0]; if (!f) return;
    outBlob = null; recordedChunks = [];
    vid.src = URL.createObjectURL(f);
    await vid.play().catch(()=>vid.pause());

    const fit = () => {
      const w = vid.videoWidth, h = vid.videoHeight;
      if (!w || !h) return;
      const scale = Math.min(innerWidth / w, (innerHeight-140) / h);
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
    };
    fit(); addEventListener("resize", fit);

    try {
      videoCaptureStream = vid.captureStream?.() || vid.mozCaptureStream?.();
      const aTracks = videoCaptureStream?.getAudioTracks?.() || [];
      audioFromVideo = aTracks?.[0] || null;
      if (!audioFromVideo) toast("No se detectó pista de audio en el video (o no es capturable).", "info");
    } catch(e) {
      audioFromVideo = null; toast("Audio del video no capturable en este navegador.", "info");
    }

    if ('requestVideoFrameCallback' in vid) {
      let lastT = 0, samples = [];
      const probe = (now, meta) => {
        if (lastT) {
          const dt = meta.mediaTime - lastT;
          if (dt > 0) { samples.push(1/dt); if (samples.length > 20) samples.shift(); }
        }
        lastT = meta.mediaTime;
        if (samples.length < 12) vid.requestVideoFrameCallback(probe);
        else {
          const s = samples.slice().sort((a,b)=>a-b);
          fpsEstimate = Math.round(s[Math.floor(s.length/2)]) || 30;
          toast(`FPS estimados: ${fpsEstimate}`, "ok");
        }
      };
      vid.requestVideoFrameCallback(probe);
    } else {
      fpsEstimate = 30;
    }

    if (!framesRequested) { framesRequested = true; rafId = requestAnimationFrame(render); }
  });

  function render() {
    if (vid.videoWidth) {
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = parseFloat(alpha.value || "0.5");
      if (cam.videoWidth) ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);
    }
    rafId = requestAnimationFrame(render);
  }

  playBtn.onclick = () => vid.play();
  pauseBtn.onclick = () => vid.pause();
  const step = () => 1 / Math.max(1, Math.round(fpsEstimate||30));
  back.onclick = () => { vid.pause(); vid.currentTime = Math.max(0, vid.currentTime - step()); };
  fwd.onclick  = () => { vid.pause(); vid.currentTime = Math.min((vid.duration||0)-0.001, vid.currentTime + step()); };

  alpha.oninput = () => alphaV.textContent = `${Math.round(parseFloat(alpha.value)*100)}%`;
  alpha.dispatchEvent(new Event('input'));

  camToggle.onclick = async () => {
    facing = (facing === "user") ? "environment" : "user";
    await startCamera();
  };

  function toggleVoice() {
    if (voiceOn) {
      try { sr?.stop(); } catch {}
      voiceOn = false; voiceBtn.textContent = "🎤 voz: off"; toast("Voz desactivada","info");
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Reconocimiento de voz no disponible en este navegador."); return; }
    sr = new SR();
    sr.lang = "es-AR"; sr.continuous = true; sr.interimResults = false;
    sr.onresult = e => {
      const phrase = e.results[e.results.length-1][0].transcript.trim().toLowerCase();
      if (phrase.includes("foto")) takeSnapshot();
      else if (phrase.includes("atrás") || phrase.includes("atras")) back.click();
      else if (phrase.includes("adelante")) fwd.click();
      else if (phrase.includes("tres segundos")) setTimeout(()=>takeSnapshot(), 3000);
      else if (phrase.includes("diez segundos")) setTimeout(()=>takeSnapshot(), 10000);
      else if (phrase.includes("grabar") || phrase.includes("grabación")) startRecording();
      else if (phrase.includes("detener") || phrase.includes("parar")) stopRecording();
    };
    sr.onend = () => { if (voiceOn) try { sr.start(); } catch {} };
    try { sr.start(); voiceOn = true; voiceBtn.textContent = "🎤 voz: ON"; toast("Voz activada","ok"); } catch {}
  }
  voiceBtn.onclick = toggleVoice;

  const snapshots = [];
  async function takeSnapshot() {
    canvas.toBlob(b => { if (b) { snapshots.push(b); toast(`Foto ${snapshots.length}`, "ok"); } }, "image/png");
  }

  function buildMixedStream() {
    canvasStream = canvas.captureStream(Math.max(10, Math.min(60, fpsEstimate || 30)));
    const tracks = [ ...canvasStream.getVideoTracks() ];
    if (audioFromVideo) tracks.push(audioFromVideo);
    return new MediaStream(tracks);
  }

  async function startRecording() {
    if (!vid.src) { toast("Cargá un video primero.", "danger"); return; }
    if (recorder) { toast("Ya estás grabando.", "info"); return; }
    recordedChunks = []; outBlob = null;

    const mixed = buildMixedStream();
    const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus") ? "video/webm;codecs=vp9,opus"
                : MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus") ? "video/webm;codecs=vp8,opus"
                : "video/webm";

    recorder = new MediaRecorder(mixed, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
    recorder.ondataavailable = e => { if (e.data && e.data.size) recordedChunks.push(e.data); };
    recorder.onstop = () => {
      outBlob = new Blob(recordedChunks, { type: mime });
      toast("Grabación lista.", "ok");
      dlBtn.disabled = false; shareBtn.disabled = false;
    };
    recorder.start(250);

    vid.currentTime = 0;
    await vid.play();
    toast("Grabando…", "info");
    recBtn.disabled = true; stopRecBtn.disabled = false;
  }

  function stopRecording() {
    if (!recorder) return;
    try { recorder.stop(); } catch {}
    try { vid.pause(); } catch {}
    recBtn.disabled = false; stopRecBtn.disabled = true;
    recorder = null;
  }

  recBtn.onclick = startRecording;
  stopRecBtn.onclick = stopRecording;

  dlBtn.onclick = () => {
    if (!outBlob) { toast("No hay video exportado.", "danger"); return; }
    const a = document.createElement("a");
    const ext = outBlob.type.includes("mp4") ? "mp4" : "webm";
    a.href = URL.createObjectURL(outBlob);
    a.download = `onion_export.${ext}`;
    a.click();
  };

  shareBtn.onclick = async () => {
    if (!outBlob) { toast("No hay video exportado.", "danger"); return; }
    const file = new File([outBlob], "onion_export.webm", { type: outBlob.type || "video/webm" });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:"Onion Skin Export", text:"Video exportado" }); }
      catch (e) { toast("Compartir cancelado.", "info"); }
    } else {
      toast("Tu dispositivo no soporta compartir archivos. Usá Descargar.", "info");
    }
  };

  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") back.click();
    if (e.key === "ArrowRight") fwd.click();
    if (e.key.toLowerCase() === " ") { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
  });

})();
</script>
</html>
