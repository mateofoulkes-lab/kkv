<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0b0b" />
<link rel="manifest" href="manifest.webmanifest">
<title>Onion Skin Video</title>
<style>
  :root {
    color-scheme: dark;
    --bg: radial-gradient(circle at top, #1b1d2a 0%, #090b12 55%, #05060a 100%);
    --panel-bg: rgba(18, 21, 33, 0.85);
    --panel-border: rgba(114, 149, 255, 0.22);
    --button-bg: linear-gradient(135deg, #20263b, #131828);
    --button-hover: linear-gradient(135deg, #2d3551, #181d2f);
    --button-border: rgba(122, 155, 255, 0.25);
    --accent: #67d6ff;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100svh;
    font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: #eef2ff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  a { color: inherit; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(2rem, 7vh, 4rem) 1.5rem calc(14rem + env(safe-area-inset-bottom));
  }
  #viewer {
    position: relative;
    display: grid;
    place-items: center;
    padding: clamp(0.8rem, 2vw, 1.6rem);
    background: rgba(5, 6, 12, 0.85);
    border-radius: clamp(18px, 3vw, 28px);
    border: 1px solid rgba(120, 140, 255, 0.25);
    box-shadow: 0 25px 65px -30px rgba(0, 0, 0, 0.9);
    max-width: min(92vw, 1100px);
    width: 100%;
  }
  canvas {
    width: 100%;
    height: auto;
    max-height: calc(100svh - 220px);
    border-radius: clamp(14px, 2vw, 24px);
    background: #000;
  }
  .frameNav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: clamp(3rem, 6vw, 3.75rem);
    height: clamp(3rem, 6vw, 3.75rem);
    border-radius: 999px;
    border: 1px solid var(--button-border);
    background: var(--button-bg);
    backdrop-filter: blur(8px);
    display: grid;
    place-items: center;
    font-size: clamp(1.45rem, 3vw, 1.9rem);
    color: #f7fbff;
    box-shadow: 0 15px 35px -20px rgba(10, 10, 18, 0.9);
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
  }
  .frameNav:hover:not(:disabled) {
    background: var(--button-hover);
    transform: translateY(-50%) scale(1.05);
  }
  .frameNav:active:not(:disabled) {
    transform: translateY(-50%) scale(0.96);
  }
  .frameNav:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  #back.frameNav { left: clamp(0.6rem, 2vw, 1.4rem); }
  #fwd.frameNav { right: clamp(0.6rem, 2vw, 1.4rem); }

  #versionTag {
    position: fixed;
    top: 0.85rem;
    right: 1rem;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(130, 130, 155, 0.5);
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
    color: #aeb6d8;
    text-transform: uppercase;
    pointer-events: none;
  }

  #banner {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 0.5rem;
    align-items: center;
    justify-content: space-between;
    background: rgba(16, 22, 40, 0.92);
    border: 1px solid rgba(123, 156, 255, 0.35);
    padding: 0.75rem 1.1rem;
    border-radius: 16px;
    width: min(480px, calc(100vw - 2rem));
    box-shadow: 0 18px 45px -28px rgba(0, 0, 0, 0.8);
  }
  #banner .msg { font-size: 0.95rem; }

  #log {
    position: fixed;
    top: calc(3.4rem + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    width: min(480px, calc(100vw - 2rem));
    text-wrap: balance;
    opacity: 0.95;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    justify-content: center;
  }

  #ui {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(1.5rem + env(safe-area-inset-bottom));
    width: min(980px, calc(100vw - 2rem));
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 26px;
    padding: 1.15rem;
    box-shadow: 0 25px 55px -32px rgba(5, 6, 12, 0.85);
    backdrop-filter: blur(22px);
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  #ui .row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    align-items: center;
    justify-content: center;
  }
  button, select, .fileInput span, input[type="range"], #ui .pill {
    font-family: inherit;
    font-size: 0.95rem;
  }
  button, select {
    background: var(--button-bg);
    color: #ecf3ff;
    border: 1px solid var(--button-border);
    border-radius: 16px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    min-width: fit-content;
  }
  button:hover:not(:disabled), select:hover {
    background: var(--button-hover);
  }
  button:active:not(:disabled) {
    transform: scale(0.97);
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  select {
    appearance: none;
    padding-right: 2.2rem;
    background-image: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0));
  }
  .pill {
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    background: rgba(103, 214, 255, 0.15);
    border: 1px solid rgba(103, 214, 255, 0.35);
    font-size: 0.85rem;
  }
  .danger { background: rgba(255, 108, 108, 0.18); border-color: rgba(255, 108, 108, 0.45); }
  .ok { background: rgba(103, 214, 255, 0.18); border-color: rgba(103, 214, 255, 0.45); }
  .info { background: rgba(130, 170, 255, 0.15); border-color: rgba(130, 170, 255, 0.45); }

  .grow {
    flex: 1 1 260px;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.75rem;
    border-radius: 18px;
    background: rgba(14, 16, 26, 0.6);
    border: 1px solid rgba(120, 140, 255, 0.2);
  }
  .grow input[type="range"] {
    width: 160px;
    max-width: 100%;
    accent-color: var(--accent);
  }
  label.toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.55rem 0.85rem;
    border-radius: 16px;
    background: rgba(14, 16, 26, 0.6);
    border: 1px solid rgba(120, 140, 255, 0.2);
  }
  label.toggle input { accent-color: var(--accent); }
  .fileInput {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    border-radius: 16px;
    border: 1px solid var(--button-border);
    background: var(--button-bg);
    cursor: pointer;
    overflow: hidden;
  }
  .fileInput span { pointer-events: none; font-weight: 600; letter-spacing: 0.02em; }
  .fileInput input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  @media (max-width: 820px) {
    #ui {
      width: min(100vw - 1rem, 720px);
      padding: 1rem;
      border-radius: 22px;
    }
    #stage {
      padding-bottom: calc(16rem + env(safe-area-inset-bottom));
    }
  }
  @media (max-width: 600px) {
    #viewer {
      padding: 0.7rem;
    }
    .frameNav {
      width: 2.85rem;
      height: 2.85rem;
      font-size: 1.4rem;
    }
    #back.frameNav { left: 0.4rem; }
    #fwd.frameNav { right: 0.4rem; }
    #ui .row {
      justify-content: flex-start;
    }
    #ui {
      bottom: calc(0.8rem + env(safe-area-inset-bottom));
      width: min(100vw - 0.8rem, 560px);
    }
    .grow {
      flex-basis: 100%;
    }
  }
</style>

<div id="stage">
  <div id="viewer">
    <canvas id="canvas"></canvas>
    <button id="back" class="frameNav" aria-label="Cuadro anterior" disabled>❮</button>
    <button id="fwd" class="frameNav" aria-label="Cuadro siguiente" disabled>❯</button>
  </div>
</div>

<div id="versionTag"></div>

<div id="banner">
  <div class="msg">Hay una nueva versión disponible.</div>
  <div style="display:flex; gap:.5rem;">
    <button id="reload" class="info">Actualizar</button>
    <button id="dismiss">Más tarde</button>
  </div>
</div>

<div id="log"></div>

<div id="ui">
  <div class="row">
    <label class="fileInput" for="file">
      <input type="file" id="file" accept="video/*" />
      <span>📁 Abrir video</span>
    </label>
    <button id="play">▶️ reproducir</button>
    <button id="pause">⏸️ pausar</button>
    <button id="camToggle">🔄 cámara: frontal</button>
    <button id="voice">🎤 voz: off</button>
    <span id="shotsCount" class="pill">0 fotos</span>
  </div>
  <div class="row">
    <label class="grow">Opacidad cámara
      <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.5">
      <span id="alphaV" class="pill">50%</span>
    </label>
    <label class="toggle">
      <input id="flipCam" type="checkbox" checked>
      <span>Invertir cámara</span>
    </label>
    <select id="fpsSel" title="FPS de exportación">
      <option value="auto" selected>FPS: auto (origen)</option>
      <option value="12">FPS: 12</option>
      <option value="15">FPS: 15</option>
      <option value="24">FPS: 24</option>
      <option value="25">FPS: 25</option>
      <option value="30">FPS: 30</option>
      <option value="60">FPS: 60</option>
    </select>
    <button id="exportAnim" class="info">🎬 exportar animación</button>
    <button id="download">⬇️ descargar MP4/WebM</button>
    <button id="share">📤 compartir</button>
    <button id="clearShots">🧻 borrar fotos</button>
    <button id="install" style="display:none;">⬇️ Instalar app</button>
  </div>
</div>

<script>
const APP_VERSION = "2.1.0";
const versionTag = document.getElementById("versionTag");
if (versionTag) {
  versionTag.textContent = `v${APP_VERSION}`;
  versionTag.setAttribute("aria-label", `Versión ${APP_VERSION}`);
}

// PWA install & update handling
let deferredPrompt = null;
const installBtn = document.getElementById('install');
const banner = document.getElementById('banner');
const reloadBtn = document.getElementById('reload');
const dismissBtn = document.getElementById('dismiss');
let hasController = !!navigator.serviceWorker?.controller;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').then(reg => {
      // SW messages (update available)
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'UPDATE_READY') {
          if (hasController) {
            banner.style.display = 'flex';
          }
        }
      });

      reloadBtn.onclick = () => {
        // Tell SW to skip waiting, then reload when controller changes
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        } else {
          // If waiting is not available yet, try to trigger update check
          reg.update();
        }
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        }, { once: true });
      };
      dismissBtn.onclick = () => banner.style.display = 'none';
    });
  });

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.style.display = 'inline-flex';
  });

  if (installBtn) {
    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    };
  }

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    hasController = true;
  });
}

(function() {
  const $ = sel => document.querySelector(sel);
  const canvas = $("#canvas");
  const ctx = canvas.getContext("2d");
  const file = $("#file");
  const playBtn = $("#play"), pauseBtn = $("#pause");
  const back = $("#back"), fwd = $("#fwd");
  const alpha = $("#alpha"), alphaV = $("#alphaV");
  const flipCam = $("#flipCam");
  const camToggle = $("#camToggle");
  const voiceBtn = $("#voice");
  const dlBtn = $("#download"), shareBtn = $("#share");
  const clearBtn = $("#clearShots");
  const shotsCount = $("#shotsCount");
  const fpsSel = $("#fpsSel");
  const exportBtn = $("#exportAnim");
  const log = $("#log");

  dlBtn.disabled = true;
  shareBtn.disabled = true;

  const snapshots = [];
  const updateShotsCount = () => {
    if (shotsCount) shotsCount.textContent = `${snapshots.length} fotos`;
  };
  updateShotsCount();

  if (clearBtn) {
    clearBtn.onclick = () => {
      snapshots.length = 0;
      updateShotsCount();
      toast("Fotos borradas", "info");
    };
  }

  // Elementos ocultos de trabajo
  const vid = document.createElement("video");
  vid.playsInline = true; vid.controls = false; vid.muted = false;
  const cam = document.createElement("video");
  cam.playsInline = true; cam.muted = true; cam.autoplay = true;

  // Estado
  let facing = "user";
  let camStream = null;
  let framesRequested = false;
  let fpsEstimate = 30;
  let sr = null, voiceOn = false;
  let outBlob = null;
  let audioFromVideo = null;
  let videoCaptureStream = null;
  let rafId = 0;
  let invertCam = true;
  let exporting = false;
  let resizeHandler = null;

  function toast(msg, kind="ok") {
    log.innerHTML = `<span class="pill ${kind}">${msg}</span>`;
    clearTimeout(toast.tid); toast.tid = setTimeout(()=>log.innerHTML="", 2000);
  }

  async function startCamera() {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing }, audio:false });
    } catch (e) {
      toast("Permití el uso de la cámara.", "danger");
      return;
    }
    cam.srcObject = camStream;
    await cam.play().catch(()=>{});
    camToggle.textContent = `🔄 cámara: ${facing === 'user' ? 'frontal' : 'trasera'}`;
  }
  await startCamera();

  back.disabled = true;
  fwd.disabled = true;

  file.addEventListener("change", async () => {
    const f = file.files?.[0]; if (!f) return;
    outBlob = null;
    dlBtn.disabled = true;
    shareBtn.disabled = true;
    snapshots.length = 0;
    updateShotsCount();

    if (resizeHandler) {
      removeEventListener("resize", resizeHandler);
      resizeHandler = null;
    }

    vid.src = URL.createObjectURL(f);
    const ready = new Promise(resolve => {
      if (vid.readyState >= 2) resolve();
      else vid.addEventListener("loadeddata", resolve, { once: true });
    });
    try { await ready; } catch {}
    try { vid.pause(); } catch {}
    try { vid.currentTime = 0; } catch {}

    const fit = () => {
      const w = vid.videoWidth, h = vid.videoHeight;
      if (!w || !h) return;
      const scale = Math.min(innerWidth / w, (innerHeight-180) / h);
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
    };
    const applyFit = () => {
      fit();
      syncSnapshotSize();
    };
    applyFit();
    resizeHandler = applyFit;
    addEventListener("resize", resizeHandler);

    try {
      videoCaptureStream?.getTracks?.().forEach(t => t.stop());
      videoCaptureStream = vid.captureStream?.() || vid.mozCaptureStream?.();
      const aTracks = videoCaptureStream?.getAudioTracks?.() || [];
      audioFromVideo = aTracks?.[0] || null;
      if (!audioFromVideo) toast("No se detectó pista de audio en el video (o no es capturable).", "info");
    } catch(e) {
      videoCaptureStream = null;
      audioFromVideo = null; toast("Audio del video no capturable en este navegador.", "info");
    }

    if ('requestVideoFrameCallback' in vid) {
      let lastT = 0, samples = [];
      const probe = (now, meta) => {
        if (lastT) {
          const dt = meta.mediaTime - lastT;
          if (dt > 0) { samples.push(1/dt); if (samples.length > 20) samples.shift(); }
        }
        lastT = meta.mediaTime;
        if (samples.length < 12) vid.requestVideoFrameCallback(probe);
        else {
          const s = samples.slice().sort((a,b)=>a-b);
          fpsEstimate = Math.round(s[Math.floor(s.length/2)]) || 30;
          toast(`FPS estimados: ${fpsEstimate}`, "ok");
        }
      };
      vid.requestVideoFrameCallback(probe);
    } else {
      fpsEstimate = 30;
    }

    back.disabled = false;
    fwd.disabled = false;

    if (!framesRequested) { framesRequested = true; rafId = requestAnimationFrame(render); }
  });

  function render() {
    if (exporting) return;
    if (vid.videoWidth) {
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    if (cam.videoWidth && cam.videoHeight && canvas.width && canvas.height) {
      const scale = Math.min(canvas.width / cam.videoWidth, canvas.height / cam.videoHeight);
      const drawW = cam.videoWidth * scale;
      const drawH = cam.videoHeight * scale;
      const offsetX = (canvas.width - drawW) / 2;
      const offsetY = (canvas.height - drawH) / 2;

      ctx.save();
      // black bars around the camera view
      ctx.fillStyle = "#000";
      if (offsetX > 0) {
        ctx.fillRect(0, 0, offsetX, canvas.height);
        ctx.fillRect(canvas.width - offsetX, 0, offsetX, canvas.height);
      }
      if (offsetY > 0) {
        ctx.fillRect(0, 0, canvas.width, offsetY);
        ctx.fillRect(0, canvas.height - offsetY, canvas.width, offsetY);
      }

      const overlayAlpha = parseFloat(alpha.value || "0.5");
      ctx.globalAlpha = overlayAlpha;
      ctx.fillRect(offsetX, offsetY, drawW, drawH);
      ctx.save();
      ctx.translate(offsetX, offsetY);
      if (invertCam) {
        ctx.translate(drawW, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(cam, 0, 0, drawW, drawH);
      ctx.restore();
      ctx.restore();
    }
    rafId = requestAnimationFrame(render);
  }

  playBtn.onclick = () => vid.play();
  pauseBtn.onclick = () => vid.pause();
  const step = () => 1 / Math.max(1, Math.round(fpsEstimate||30));
  back.onclick = () => { vid.pause(); vid.currentTime = Math.max(0, vid.currentTime - step()); };
  fwd.onclick  = () => { vid.pause(); vid.currentTime = Math.min((vid.duration||0)-0.001, vid.currentTime + step()); };

  alpha.oninput = () => alphaV.textContent = `${Math.round(parseFloat(alpha.value)*100)}%`;
  alpha.dispatchEvent(new Event('input'));

  camToggle.onclick = async () => {
    facing = (facing === "user") ? "environment" : "user";
    await startCamera();
  };

  flipCam.addEventListener("change", () => {
    invertCam = !!flipCam.checked;
  });
  invertCam = !!flipCam.checked;

  function toggleVoice() {
    if (voiceOn) {
      try { sr?.stop(); } catch {}
      voiceOn = false; voiceBtn.textContent = "🎤 voz: off"; toast("Voz desactivada","info");
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Reconocimiento de voz no disponible en este navegador."); return; }
    sr = new SR();
    sr.lang = "es-AR"; sr.continuous = true; sr.interimResults = false;
    sr.onresult = e => {
      const phrase = e.results[e.results.length-1][0].transcript.trim().toLowerCase();
      if (phrase.includes("foto")) takeSnapshot();
      else if (phrase.includes("atrás") || phrase.includes("atras")) back.click();
      else if (phrase.includes("adelante")) fwd.click();
      else if (phrase.includes("tres segundos")) setTimeout(()=>takeSnapshot(), 3000);
      else if (phrase.includes("diez segundos")) setTimeout(()=>takeSnapshot(), 10000);
      else if (phrase.includes("grabar") || phrase.includes("grabación") || phrase.includes("exportar")) exportFromSnapshots();
      else if (phrase.includes("detener") || phrase.includes("parar")) toast("No hay grabación en vivo que detener.", "info");
    };
    sr.onend = () => { if (voiceOn) try { sr.start(); } catch {} };
    try { sr.start(); voiceOn = true; voiceBtn.textContent = "🎤 voz: ON"; toast("Voz activada","ok"); } catch {}
  }
  voiceBtn.onclick = toggleVoice;

  async function takeSnapshot() {
    canvas.toBlob(b => {
      if (b) {
        snapshots.push(b);
        updateShotsCount();
        toast(`Foto ${snapshots.length}`, "ok");
      }
    }, "image/png");
  }

  function resolveExportFps() {
    const sel = fpsSel?.value || "auto";
    if (sel === "auto") return Math.max(1, Math.round(fpsEstimate || 24));
    return parseInt(sel, 10) || Math.max(1, Math.round(fpsEstimate || 24));
  }

  let syncCanvas = null;
  let syncCtx = null;
  function syncSnapshotSize() {
    if (!canvas.width || !canvas.height) return;
    if (!syncCanvas) {
      syncCanvas = document.createElement("canvas");
      syncCtx = syncCanvas.getContext("2d");
    }
    syncCanvas.width = canvas.width;
    syncCanvas.height = canvas.height;
  }

  const chunks = [];
  let recorder = null;
  let outType = "video/webm";
  let forcedPlay = false;

  async function exportFromSnapshots() {
    if (!snapshots.length) { toast("No hay fotos para exportar.", "info"); return; }
    if (exporting) return;
    exporting = true;
    const fpsOut = resolveExportFps();

    if (exportBtn) exportBtn.disabled = true;

    if (!syncCanvas) syncSnapshotSize();

    const stream = syncCanvas.captureStream?.(fpsOut) || syncCanvas.mozCaptureStream?.(fpsOut);
    if (!stream) { toast("No se pudo crear stream de exportación", "danger"); exporting = false; if (exportBtn) exportBtn.disabled = false; return; }

    let options = { mimeType: "video/webm; codecs=vp9" };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
      options = { mimeType: "video/webm; codecs=vp8" };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: "video/webm" };
      }
    }

    try {
      recorder = new MediaRecorder(stream, options);
      outType = recorder.mimeType || "video/webm";
    } catch (err) {
      toast("No se pudo iniciar la grabación.", "danger");
      exporting = false;
      if (exportBtn) exportBtn.disabled = false;
      return;
    }

    chunks.length = 0;

    recorder.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
    const stopped = new Promise((resolve, reject) => {
      recorder.onstop = () => {
        try { stream.getTracks().forEach(t => t.stop()); } catch {}
        if (audioTrack && audioTrack !== audioFromVideo) {
          try { audioTrack.stop(); } catch {}
        }
        outBlob = new Blob(chunks, { type: outType });
        toast("Animación exportada.", "ok");
        dlBtn.disabled = false;
        shareBtn.disabled = false;
        resolve();
      };
      recorder.onerror = event => {
        try { stream.getTracks().forEach(t => t.stop()); } catch {}
        if (audioTrack && audioTrack !== audioFromVideo) {
          try { audioTrack.stop(); } catch {}
        }
        reject(event.error || event);
      };
    });

    const prevTime = vid.currentTime;
    const prevMuted = vid.muted;
    const prevVolume = vid.volume;
    const wasPaused = vid.paused;

    const audioTrack = audioFromVideo ? audioFromVideo.clone() : null;
    if (audioTrack) {
      stream.addTrack(audioTrack);
    }

    recorder.start();

    const ctx = syncCtx;
    const canvas = syncCanvas;

    try { vid.pause(); vid.currentTime = 0; } catch {}

    if (audioTrack) {
      try {
        vid.volume = 0;
        await vid.play();
        forcedPlay = true;
      } catch {
        forcedPlay = false;
      }
    }

    const frameDurMs = 1000 / fpsOut;
    const wait = ms => new Promise(res => setTimeout(res, ms));
    const loadImage = blob => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("No se pudo cargar la foto"));
      };
      img.src = url;
    });

    try {
      for (let i = 0; i < snapshots.length; i++) {
        const img = await loadImage(snapshots[i]);
        ctx.save();
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        if (typeof img.close === "function") img.close();
        await wait(frameDurMs);
      }
    } catch (err) {
      toast("Error al exportar la animación.", "danger");
      try { recorder.stop(); } catch {}
      await stopped;
      if (forcedPlay) {
        try { vid.pause(); } catch {}
      }
      vid.muted = prevMuted;
      vid.volume = prevVolume;
      exporting = false;
      vid.currentTime = prevTime;
      if (!wasPaused) { vid.play().catch(()=>{}); }
      else { vid.pause(); }
      if (exportBtn) exportBtn.disabled = false;
      rafId = requestAnimationFrame(render);
      return;
    }

    setTimeout(() => {
      try { recorder.stop(); } catch {}
    }, frameDurMs);

    try {
      await stopped;
    } catch (err) {
      toast("Error durante la exportación.", "danger");
      exporting = false;
      if (exportBtn) exportBtn.disabled = false;
      rafId = requestAnimationFrame(render);
      return;
    }

    if (forcedPlay) {
      try { vid.pause(); } catch {}
    }
    vid.muted = prevMuted;
    vid.volume = prevVolume;

    vid.currentTime = prevTime;
    if (!wasPaused) {
      vid.play().catch(()=>{});
    } else {
      vid.pause();
    }

    exporting = false;
    if (exportBtn) exportBtn.disabled = false;
    rafId = requestAnimationFrame(render);
  }

  if (exportBtn) exportBtn.onclick = exportFromSnapshots;

  dlBtn.onclick = () => {
    if (!outBlob) { toast("No hay video exportado.", "danger"); return; }
    const a = document.createElement("a");
    const ext = outBlob.type.includes("mp4") ? "mp4" : "webm";
    a.href = URL.createObjectURL(outBlob);
    a.download = `onion_export.${ext}`;
    a.click();
  };

  shareBtn.onclick = async () => {
    if (!outBlob) { toast("No hay video exportado.", "danger"); return; }
    const file = new File([outBlob], "onion_export.webm", { type: outBlob.type || "video/webm" });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:"Onion Skin Export", text:"Video exportado" }); }
      catch (e) { toast("Compartir cancelado.", "info"); }
    } else {
      toast("Tu dispositivo no soporta compartir archivos. Usá Descargar.", "info");
    }
  };

  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") back.click();
    if (e.key === "ArrowRight") fwd.click();
    if (e.key.toLowerCase() === " ") { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
  });

})();
</script>
</html>
